<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-5 -5 394 174" width="394" height="174">
  <!-- official leanx.io wordmark (images/300ppi/logo.png) with a white outline so it reads on the dark theme -->
  <defs>
    <filter id="o" x="-5%" y="-10%" width="110%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.5" result="d"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="d" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image width="384" height="164" filter="url(#o)" xlink:href="data:image/png;base64,"/>
</svg>
